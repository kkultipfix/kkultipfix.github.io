<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영상 속 제품 모음</title>
<style>
  :root { --bg: #f6f7f9; --card: #ffffff; --ink: #111827; --ink2: #6b7280; --line: #e5e7eb; --accent: #e11d48; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --card: #1e293b; --ink: #f1f5f9; --ink2: #94a3b8; --line: #334155; --accent: #fb7185; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  .notice { font-size: 12px; color: var(--ink2); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 10px 0 14px; line-height: 1.5; }
  .find { display: flex; gap: 8px; margin-bottom: 14px; }
  .find input { flex: 1; font-size: 18px; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .card { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 10px; text-decoration: none; color: inherit; }
  .card.hide { display: none; } .card.hit { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
  .pic { flex: 0 0 auto; width: 76px; height: 76px; border-radius: 10px; object-fit: cover; background: var(--line); }
  .no { display: block; font-size: 13px; font-weight: 800; color: var(--accent); margin-bottom: 2px; }
  .body { flex: 1; min-width: 0; } .body b { display: block; font-size: 15px; } .body small { display: block; color: var(--ink2); font-size: 12px; margin-top: 2px; }
  .go { flex: 0 0 auto; font-size: 13px; font-weight: 700; color: #fff; background: var(--accent); border-radius: 8px; padding: 8px 10px; white-space: nowrap; }
  .empty { color: var(--ink2); text-align: center; padding: 30px 0; }
  footer { color: var(--ink2); font-size: 12px; text-align: center; margin: 20px 0; }
</style>
</head>
<body>
<main>
  <h1>영상 속 제품 모음</h1>
  <div class="notice">이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</div>
  <div class="find"><input id="q" type="number" inputmode="numeric" placeholder="영상에서 본 번호 (예: 12)" aria-label="영상 번호"></div>
  <a class="card" id="n2" data-no="2" href="https://link.coupang.com/a/hsBI7hVBmu" target="_blank" rel="nofollow sponsored noopener"><img class="pic" src="img/4a.jpg" alt="" loading="lazy" onerror="this.style.visibility='hidden'"><span class="body"><span class="no">2번</span><b>전기포트인데 라면이 끓는다고?</b><small>자취방 라면, 냄비 말고 이거 하나면 돼요</small></span><span class="go">쿠팡에서 보기</span></a>
<a class="card" id="n1" data-no="1" href="https://link.coupang.com/a/hrzsWVtx7c" target="_blank" rel="nofollow sponsored noopener"><img class="pic" src="img/1a.jpg" alt="" loading="lazy" onerror="this.style.visibility='hidden'"><span class="body"><span class="no">1번</span><b>비트 O2 강력 얼룩제거제</b><small>빨아도 안 지워지는 셔츠 목때 해결법</small></span><span class="go">쿠팡에서 보기</span></a>
  <p class="empty" id="none" hidden>그 번호의 제품이 없어요.</p>
  <footer>2026.9.30 기준 · 제품 2개</footer>
</main>
<script>
  const q = document.getElementById("q"); // 번호 입력
  const cards = [...document.querySelectorAll(".card")]; // 제품 카드
  q.addEventListener("input", () => {
    const v = q.value.trim(); // 입력값
    let shown = 0; // 보이는 수
    for (const c of cards) { const hit = v === "" || c.dataset.no === v; c.classList.toggle("hide", !hit); c.classList.toggle("hit", v !== "" && hit); if (hit) shown++; } // 번호로 거르기
    document.getElementById("none").hidden = shown > 0; // 없을 때 안내
  });
  if (location.hash.startsWith("#n")) { q.value = location.hash.slice(2); q.dispatchEvent(new Event("input")); } // 주소 끝 #n12 로 바로 찾기
</script>
</body>
</html>
